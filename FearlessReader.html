<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Fearless Reading Assistant (Voice Enabled)</title> 
<style> 
:root { 
  --bg-color: #f8fafc; 
  --card-bg: #ffffff; 
  --text-color: #1e293b; 
  --primary-color: #3b82f6; 
  --highlight-bg: #fef08a; 
  --spoken-color: #22c55e; 
  --dimmed-text: #94a3b8; 
  --border-color: #e2e8f0; 
  --font-scale: 1.4rem;
  --line-scale: 2.4rem;
} 
body { 
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
  background-color: var(--bg-color); 
  color: var(--text-color); 
  margin: 0; 
  padding: 20px; 
  display: flex;
  justify-content: center; 
} 
.container { 
  max-width: 800px; 
  width: 100%; 
  display: flex; 
  flex-direction: column; 
  gap: 20px; 
}
.header { 
  text-align: center; 
  padding: 10px 0; 
} 
.header h1 { 
  margin: 0; 
  font-size: 1.8rem; 
  color: var(--primary-color); 
}
.header p { 
  margin: 5px 0 0 0; 
  color: #64748b; 
  font-size: 0.95rem; 
} 
.card { 
  background: var(--card-bg); 
  border: 1px solid var(--border-color); 
  border-radius: 16px; 
  padding: 24px; 
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); 
} 
textarea {
  width: 100%; 
  height: 150px; 
  border: 1px solid var(--border-color); 
  border-radius: 8px; 
  padding: 12px; 
  font-size: 1rem;
  resize: vertical; 
  box-sizing: border-box; 
  font-family: inherit; 
} 

.accessibility-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  background: #f1f5f9;
  padding: 12px;
  border-radius: 10px;
  align-items: center;
  font-size: 0.9rem;
}
.control-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.stats-dashboard {
  display: flex;
  justify-content: space-around;
  background: #f8fafc;
  border: 1px dashed var(--border-color);
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 5px;
}
.stat-item {
  text-align: center;
  font-size: 0.85rem;
  color: #64748b;
  font-weight: 500;
}
.stat-value {
  display: block;
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--primary-color);
}
.stat-value.green {
  color: var(--spoken-color);
}

.btn { 
  background-color: var(--primary-color); 
  color: white;
  border: none; 
  padding: 14px 24px; 
  border-radius: 8px; 
  font-size: 1rem; 
  font-weight: 600; 
  cursor: pointer; 
  margin-top: 12px; 
  width: 100%; 
  transition: background 0.2s; 
} 
.btn:hover { 
  background-color: #2563eb; 
} 

.reading-arena { 
  display: none; 
  flex-direction: column; 
  gap: 20px; 
} 
.progress-bar-container { 
  background: var(--border-color); 
  border-radius: 9999px; 
  height: 8px; 
  width: 100%; 
  overflow: hidden; 
} 
.progress-bar-fill { 
  background: var(--primary-color); 
  height: 100%; 
  width: 0%; 
  transition: width 0.15s linear; 
} 
.meta-info { 
  display: flex; 
  justify-content: space-between; 
  align-items: center;
  color: #64748b; 
  font-size: 0.9rem; 
  font-weight: 500; 
} 

.voice-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: bold;
  background: #eee;
  transition: all 0.3s ease;
}
.voice-status-badge.listening {
  background: #dcfce7;
  color: #166534;
  animation: pulseGlow 2s infinite;
}
.voice-status-badge.disabled {
  background: #f1f5f9;
  color: #64748b;
}
@keyframes pulseGlow {
  0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
  70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

.paragraph-box { 
  font-size: var(--font-scale); 
  line-height: var(--line-scale);
  letter-spacing: 0.03em; 
  padding: 24px; 
  border-left: 4px solid var(--primary-color); 
  background: #fdfdfd; 
  border-radius: 0 8px 8px 0;
} 

.sentence { 
  transition: color 0.1s ease, background-color 0.1s ease; 
  padding: 2px 4px; 
  border-radius: 4px; 
  display: inline; 
} 
.sentence.active { 
  color: var(--text-color); 
  background-color: var(--highlight-bg); 
} 
.sentence.dimmed { 
  color: var(--dimmed-text); 
} 
.word-span {
  display: inline-block;
  white-space: pre;
  border-radius: 4px;
  padding: 0 2px;
  /* Hardware Accelerated rendering transitions */
  transition: background-color 0.08s cubic-bezier(0, 0, 0.2, 1), 
              color 0.08s cubic-bezier(0, 0, 0.2, 1);
  cursor: pointer;
  will-change: background-color, color;
}
.word-span:hover {
  background-color: #e2e8f0;
}
.word-span.spoken {
  color: white !important;
  background-color: var(--spoken-color) !important;
}
.bionic-bold { 
  font-weight: 700; 
  color: inherit;
} 
.sentence.active .bionic-bold {
  color: #000;
}
.sentence.active .word-span.spoken .bionic-bold {
  color: white;
}

.navigation-controls { 
  display: flex; 
  justify-content: space-between; 
  gap: 15px; 
  margin-top: 10px; 
} 
.nav-btn { 
  flex: 1; 
  background: #ffffff;
  border: 2px solid var(--border-color); 
  padding: 14px; 
  border-radius: 10px; 
  font-weight: 600; 
  cursor: pointer; 
  font-size: 1rem; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  gap: 8px; 
  transition: all 0.2s; 
} 
.nav-btn:hover:not(:disabled) { 
  border-color: var(--primary-color); 
  color: var(--primary-color); 
  background: #f0f7ff; 
} 
.nav-btn:disabled { 
  opacity: 0.4; 
  cursor: not-allowed; 
} 

#toast-notification {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1e293b;
  color: white;
  padding: 12px 24px;
  border-radius: 30px;
  font-size: 0.9rem;
  font-weight: 500;
  box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 8px;
}
#toast-notification.show {
  transform: translateX(-50%) translateY(0);
}

.action-bar { 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  border-top: 1px solid var(--border-color); 
  padding-top: 15px; 
  margin-top: 15px; 
} 
.exit-btn { 
  background: none;
  border: none; 
  color: #ef4444; 
  font-weight: 600; 
  cursor: pointer; 
  font-size: 0.95rem; 
} 
</style> 
</head> 
<body> 
<div class="container"> 
  <div class="header"> 
    <h1>📘 Fearless Reading Assistant</h1> 
    <p>One step, one paragraph, one sentence at a time.</p> 
  </div> 
  
  <div id="setup-card" class="card"> 
    <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #334155;"> 
      Paste your book chapter or article below: 
    </label> 
    <textarea id="text-input" placeholder="Type or paste large text blocks here...">The swift brown fox jumps over the lazy dog. Voice activation lets you control pacing automatically. Just read out loud naturally!</textarea> 
    
    <div class="accessibility-bar" style="margin-top:15px;">
      <div class="control-group">
        <input type="checkbox" id="voice-toggle-init" checked>
        <label for="voice-toggle-init"><b>Enable Voice Tracking Engine</b> (Requires Mic)</label>
      </div>
    </div>

    <button class="btn" onclick="initializeReadingSession()">Start Reading Fearlessly</button> 
  </div> 

  <div id="reading-card" class="card reading-arena"> 
    <div class="accessibility-bar">
      <div class="control-group">
        <label>Size:</label>
        <button onclick="adjustTextSize(0.1)" class="nav-btn" style="padding:4px 10px; font-size:0.8rem;">A+</button>
        <button onclick="adjustTextSize(-0.1)" class="nav-btn" style="padding:4px 10px; font-size:0.8rem;">A-</button>
      </div>
      <div class="control-group">
        <input type="checkbox" id="voice-live-toggle" onchange="toggleVoiceEngine(this.checked)">
        <label for="voice-live-toggle">Voice Control</label>
      </div>
      <div id="voice-badge" class="voice-status-badge disabled">🎤 Engine Off</div>
    </div>

    <div class="stats-dashboard">
      <div class="stat-item">
        Words Read
        <span id="stat-words" class="stat-value green">0</span>
      </div>
      <div class="stat-item">
        Sentences Completed
        <span id="stat-sentences" class="stat-value">0</span>
      </div>
    </div>

    <div class="progress-bar-container"> 
      <div id="progress-bar" class="progress-bar-fill"></div> 
    </div>
    
    <div class="meta-info"> 
      <span id="paragraph-counter">Paragraph 1 of 1</span> 
      <span id="sentence-counter">Sentence 1 of 1</span> 
    </div> 
    
    <div id="display-box" class="paragraph-box"></div> 
    
    <div class="navigation-controls"> 
      <button id="prev-btn" class="nav-btn" onclick="navigatePrevious()">&larr; Previous</button> 
      <button id="next-btn" class="nav-btn" style="background: var(--primary-color); color: white; border: none;" onclick="navigateNext()">Next &rarr;</button> 
    </div> 
    
    <div class="action-bar"> 
      <span style="font-size: 0.85rem; color: #64748b;">💡 Use <b>Mic</b>, <b>Left/Right arrows</b>, <b>Spacebar</b>, or click any word to skip!</span> 
      <button class="exit-btn" onclick="exitReadingSession()">Change Text</button> 
    </div> 
  </div> 
</div> 

<div id="toast-notification">🔊 Voice Tracking Engine Active</div>

<script> 
let paragraphsData = []; 
let activeParagraphIndex = 0; 
let activeSentenceIndex = 0; 
let totalSentencesCount = 0;

let voiceActive = false;
let recognition = null;
let currentSentenceWordsData = []; 
let lastSpokenWordIndex = -1;
let isAdvancing = false; 

let sessionWordsReadCount = 0;
let sessionSentencesReadCount = 0;
let highestWordIndexReachedThisSentence = -1;
let sentenceCountedAsRead = false;

document.addEventListener('keydown', function(event) { 
  const readingCard = document.getElementById('reading-card');
  if (window.getComputedStyle(readingCard).display === 'flex') { 
    if (event.key === 'ArrowRight' || event.key === ' ') { 
      event.preventDefault(); 
      navigateNext(); 
    } else if (event.key === 'ArrowLeft') { 
      event.preventDefault(); 
      navigatePrevious(); 
    } 
  } 
}); 

function showToast(message, duration = 3000) {
  const toast = document.getElementById('toast-notification');
  toast.innerText = message;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, duration);
}

function adjustTextSize(factor) {
  const root = document.documentElement;
  let currentSize = parseFloat(getComputedStyle(root).getPropertyValue('--font-scale'));
  let currentLine = parseFloat(getComputedStyle(root).getPropertyValue('--line-scale'));
  root.style.setProperty('--font-scale', (currentSize + factor) + 'rem');
  root.style.setProperty('--line-scale', (currentLine + (factor * 1.5)) + 'rem');
}

function splitIntoSentences(text) {
  if (!text) return [];
  const tokenRegex = /[^.!?]+[.!?]+["'”’]?|.+$/g;
  const matches = text.match(tokenRegex) || [text];
  
  let cleanSentences = [];
  let tempBuffer = "";

  matches.forEach(segment => {
    let current = tempBuffer ? tempBuffer + segment : segment;
    if (/[A-Z][a-z]{1,3}\.\s*$/.test(current) && current.length < 10) {
      tempBuffer = current;
    } else {
      cleanSentences.push(current.trim());
      tempBuffer = "";
    }
  });
  
  if (tempBuffer) cleanSentences.push(tempBuffer.trim());
  return cleanSentences.filter(s => s.length > 0);
}

function initializeReadingSession() { 
  const rawText = document.getElementById('text-input').value.trim(); 
  if (!rawText) { 
    alert("Please enter some text to start reading!"); 
    return; 
  } 
  
  const cleanParagraphs = rawText.split(/\n+/).map(p => p.trim()).filter(p => p.length > 0); 
  
  totalSentencesCount = 0;
  paragraphsData = cleanParagraphs.map(paragraphText => { 
    const sentences = splitIntoSentences(paragraphText);
    totalSentencesCount += sentences.length;
    return sentences;
  }).filter(pArr => pArr.length > 0); 

  if (paragraphsData.length === 0) {
    alert("Could not extract readable text structures.");
    return;
  }

  activeParagraphIndex = 0; 
  activeSentenceIndex = 0; 
  isAdvancing = false;
  
  document.getElementById('setup-card').style.display = 'none'; 
  document.getElementById('reading-card').style.display = 'flex'; 

  const shouldVoiceRun = document.getElementById('voice-toggle-init').checked;
  document.getElementById('voice-live-toggle').checked = shouldVoiceRun;
  
  renderActiveLayout(); 
  toggleVoiceEngine(shouldVoiceRun);
} 

function applyBionicTextFormatting(word) { 
  const match = word.match(/^([^\w]*)([\w’‘'-]+)([^\w]*)$/);
  if (!match) return word;
  
  const leadingPunct = match[1];
  const coreWord = match[2];
  const trailingPunct = match[3];
  
  let boldLength = 1; 
  if (coreWord.length > 3) boldLength = 2; 
  if (coreWord.length > 5) boldLength = Math.ceil(coreWord.length * 0.4); 
  
  const boldPart = coreWord.substring(0, boldLength); 
  const restPart = coreWord.substring(boldLength); 
  
  return `${leadingPunct}<span class="bionic-bold">${boldPart}</span>${restPart}${trailingPunct}`; 
} 

function calculateCurrentAbsoluteIndex() {
  let count = 0;
  for (let i = 0; i < activeParagraphIndex; i++) {
    count += paragraphsData[i].length;
  }
  return count + activeSentenceIndex;
}

function renderActiveLayout() { 
  const displayBox = document.getElementById('display-box'); 
  displayBox.innerHTML = ''; 
  
  const activeParagraph = paragraphsData[activeParagraphIndex]; 
  
  currentSentenceWordsData = [];
  lastSpokenWordIndex = -1;
  highestWordIndexReachedThisSentence = -1;
  sentenceCountedAsRead = false;
  isAdvancing = false;

  activeParagraph.forEach((sentenceText, sIdx) => { 
    const sentenceSpan = document.createElement('span'); 
    sentenceSpan.className = 'sentence'; 
    
    if (sIdx === activeSentenceIndex) { 
      sentenceSpan.classList.add('active');
      
      const wordsArray = sentenceText.split(/\s+/).filter(w => w.length > 0);
      wordsArray.forEach((w, wIdx) => {
        const wordSpan = document.createElement('span');
        wordSpan.className = 'word-span';
        wordSpan.id = `word-${wIdx}`;
        wordSpan.innerHTML = applyBionicTextFormatting(w);
        
        wordSpan.onclick = (e) => {
          e.stopPropagation();
          setWordTrackingCursor(wIdx);
        };

        const normalized = w.toLowerCase().replace(/[\d\W_]/g, "");
        currentSentenceWordsData.push({
          word: normalized,
          spoken: false,
          domElement: wordSpan
        });
        
        sentenceSpan.appendChild(wordSpan);
      });
    } else { 
      sentenceSpan.classList.add('dimmed'); 
      sentenceSpan.innerHTML = sentenceText.split(/\s+/).map(applyBionicTextFormatting).join(' ');
    } 
    
    displayBox.appendChild(sentenceSpan); 
    displayBox.appendChild(document.createTextNode(' ')); 
  }); 

  document.getElementById('paragraph-counter').innerText = `Paragraph ${activeParagraphIndex + 1} of ${paragraphsData.length}`; 
  document.getElementById('sentence-counter').innerText = `Sentence ${activeSentenceIndex + 1} of ${activeParagraph.length}`; 
  
  const currentSentenceProgress = calculateCurrentAbsoluteIndex();
  const percentageProgress = totalSentencesCount > 1 ? (currentSentenceProgress / (totalSentencesCount - 1)) * 100 : 100;
  document.getElementById('progress-bar').style.width = `${percentageProgress}%`; 

  document.getElementById('prev-btn').disabled = (activeParagraphIndex === 0 && activeSentenceIndex === 0); 
  
  const isLastSentenceOfLastParagraph = (activeParagraphIndex === paragraphsData.length - 1 && activeSentenceIndex === activeParagraph.length - 1); 
  const nextBtn = document.getElementById('next-btn'); 
  
  if (isLastSentenceOfLastParagraph) { 
    nextBtn.innerText = "🎉 Finish!"; 
    nextBtn.style.backgroundColor = "#10b981"; 
  } else { 
    nextBtn.innerText = "Next \u2192"; 
    nextBtn.style.backgroundColor = "var(--primary-color)"; 
  } 
} 

function updateLiveStatsDisplay() {
  document.getElementById('stat-words').innerText = sessionWordsReadCount;
  document.getElementById('stat-sentences').innerText = sessionSentencesReadCount;
}

function setWordTrackingCursor(targetIdx) {
  currentSentenceWordsData.forEach((wd, idx) => {
    if(idx <= targetIdx) {
      if (!wd.spoken) {
        wd.spoken = true;
        wd.domElement.classList.add('spoken');
        if (idx > highestWordIndexReachedThisSentence) {
          sessionWordsReadCount++;
          highestWordIndexReachedThisSentence = idx;
        }
      }
    } else {
      wd.spoken = false;
      wd.domElement.classList.remove('spoken');
    }
  });
  lastSpokenWordIndex = targetIdx;
  updateLiveStatsDisplay();
  checkSentenceCompletion();
}

function toggleVoiceEngine(enable) {
  voiceActive = enable;
  const badge = document.getElementById('voice-badge');
  
  if (!enable) {
    badge.innerText = "🎤 Engine Off";
    badge.className = "voice-status-badge disabled";
    if (recognition) {
      recognition.stop();
    }
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Web Speech API is not supported in this browser. Please use Chrome, Edge, or Safari.");
    document.getElementById('voice-live-toggle').checked = false;
    badge.innerText = "❌ Unsupported";
    return;
  }

  if (!recognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true; 
    recognition.lang = 'en-US';

    recognition.onstart = () => {
      badge.innerText = "📡 Mic Listening...";
      badge.className = "voice-status-badge listening";
      showToast("🎤 Tracking Voice Active");
    };

    recognition.onerror = (e) => {
      if (e.error === 'not-allowed') {
        alert("Microphone access denied. Please update your browser permissions.");
        document.getElementById('voice-live-toggle').checked = false;
        toggleVoiceEngine(false);
      }
    };

    recognition.onend = () => {
      if (voiceActive) {
        try { recognition.start(); } catch(err) {}
      } else {
        badge.innerText = "🎤 Engine Off";
        badge.className = "voice-status-badge disabled";
      }
    };

    recognition.onresult = (event) => {
      if (isAdvancing) return;
      
      // MILLISECOND OPTIMIZATION: Extract only the single newest spoken token segment 
      // instead of re-parsing the historical text transcript loop.
      const lastResultIndex = event.results.length - 1;
      const currentResult = event.results[lastResultIndex];
      const transcriptChunk = currentResult[0].transcript;

      // Filter: Process immediately using lookahead to block random background noise
      if (transcriptChunk) {
        processSpeechInput(transcriptChunk);
      }
    };
  }

  try {
    recognition.start();
  } catch(e) {}
}

function processSpeechInput(transcript) {
  if (isAdvancing) return;
  
  // Clean raw stream inputs into array vectors
  const words = transcript.toLowerCase().trim().split(/\s+/);
  
  words.forEach(spokenWord => {
    const cleanWord = spokenWord.replace(/[\d\W_]/g, "");
    if (!cleanWord) return;
    
    // Controlled Lookahead Anchor verification (restricts matching scope to immediate context)
    const lookaheadRange = 3;
    let matchFoundIndex = -1;

    for (let i = 1; i <= lookaheadRange; i++) {
      let testingIndex = lastSpokenWordIndex + i;
      if (testingIndex < currentSentenceWordsData.length) {
        if (currentSentenceWordsData[testingIndex].word === cleanWord) {
          matchFoundIndex = testingIndex;
          break;
        }
      }
    }

    if (matchFoundIndex !== -1) {
      // Millisecond update phase: color matched words immediately
      for(let j = lastSpokenWordIndex + 1; j <= matchFoundIndex; j++) {
        if (!currentSentenceWordsData[j].spoken) {
          currentSentenceWordsData[j].spoken = true;
          currentSentenceWordsData[j].domElement.classList.add('spoken');
          
          if (j > highestWordIndexReachedThisSentence) {
            sessionWordsReadCount++;
            highestWordIndexReachedThisSentence = j;
          }
        }
      }
      lastSpokenWordIndex = matchFoundIndex;
      updateLiveStatsDisplay();
      checkSentenceCompletion();
    }
  });
}

function checkSentenceCompletion() {
  if (isAdvancing) return;
  
  const spokenCount = currentSentenceWordsData.filter(w => w.spoken).length;
  const ratio = spokenCount / currentSentenceWordsData.length;
  
  if (lastSpokenWordIndex === currentSentenceWordsData.length - 1 || ratio >= 0.95) {
    if (!sentenceCountedAsRead) {
      sessionSentencesReadCount++;
      sentenceCountedAsRead = true;
      updateLiveStatsDisplay();
    }
    
    isAdvancing = true;
    setTimeout(() => {
      navigateNext();
    }, 250); // Lowered structural delay for faster, more fluid text changes
  }
}

function navigateNext() { 
  if (!sentenceCountedAsRead && paragraphsData.length > 0) {
    sessionSentencesReadCount++;
  }
  
  const currentParagraph = paragraphsData[activeParagraphIndex]; 
  if (activeSentenceIndex < currentParagraph.length - 1) { 
    activeSentenceIndex++; 
  } else if (activeParagraphIndex < paragraphsData.length - 1) { 
    activeParagraphIndex++; 
    activeSentenceIndex = 0; 
  } else { 
    updateLiveStatsDisplay();
    showToast("🎉 Reading Complete!");
    alert("Awesome job! You finished reading the entire text successfully!"); 
    exitReadingSession(); 
    return; 
  } 
  renderActiveLayout(); 
} 

function navigatePrevious() { 
  if (activeSentenceIndex > 0) { 
    activeSentenceIndex--; 
  } else if (activeParagraphIndex > 0) { 
    activeParagraphIndex--; 
    activeSentenceIndex = paragraphsData[activeParagraphIndex].length - 1; 
  } 
  renderActiveLayout(); 
} 

function exitReadingSession() { 
  voiceActive = false;
  if (recognition) recognition.stop();
  document.getElementById('setup-card').style.display = 'block'; 
  document.getElementById('reading-card').style.display = 'none'; 
} 
</script> 
</body> 
</html>
